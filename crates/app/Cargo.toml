[package]
name = "cut"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }
draad-codegen = { git = "https://github.com/somfic/draad", features = [
    "tauri",
] }

[[bin]]
name = "cut"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
cut-engine = { path = "../engine" }
cut-render = { path = "../render" }
draad = { git = "https://github.com/somfic/draad", features = ["tauri"] }
async-trait = "0.1"
futures = { workspace = true }
serde = { version = "1", features = ["derive"] }
# `unstable` is what gates `Window::add_child`, the multi-surface API the whole
# approach rests on.
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
wgpu = "27"

# Killing the dev server means killing its whole process group: `bun run dev`
# runs vite as a grandchild.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only the tests construct a `Source` by hand, which needs the `Fraction` its
# frame rate is measured in.
[dev-dependencies]
gstreamer = "0.25.3"
