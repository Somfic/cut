[package]
name = "cut"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "cut"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
cut-engine = { path = "../engine" }
cut-render = { path = "../render" }
futures = { workspace = true }
serde = { version = "1", features = ["derive"] }
# `unstable` is what gates `Window::add_child`, the multi-surface API the whole
# approach rests on.
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
wgpu = "27"
