<!doctype html>
<meta charset="utf-8" />
<title>cut — overlay spike</title>
<style>
  /* Transparent all the way down: if any of these paint, the video is hidden
     and it is this page's fault rather than the compositor's. */
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    display: flex; flex-direction: column;  
    font: 13px -apple-system, system-ui, sans-serif;
    color: #eee; -webkit-user-select: none; user-select: none;
  }

  /* The hole. Nothing is drawn here — it only reserves the rect that gets
     reported to Rust, and the outline proves the video lands inside it. */
  #video { flex: 1; margin: 12px; outline: 1px dashed rgba(255,255,255,.25); }

  /* Question 3: clicks must land here and nowhere else. */
  #bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: rgba(28,28,30,.82);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  button {
    font: inherit; color: #eee; padding: 5px 14px; border-radius: 6px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
  }
  button:active { background: rgba(255,255,255,.22); }
  #readout { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .75; }
  #clicks { opacity: .75; }
</style>

<div id="video"></div>
<div id="bar">
  <button id="toggle">Play / Pause</button>
  <span id="clicks">clicks on chrome: 0</span>
  <span id="readout">…</span>
</div>

<script>
  const { invoke } = window.__TAURI__.core;

  // Question 3. A click that reaches the video hole rather than the chrome is
  // a failure, so count each separately.
  let chromeClicks = 0;
  document.getElementById('bar').addEventListener('click', () => {
    document.getElementById('clicks').textContent =
      `clicks on chrome: ${++chromeClicks}`;
  });
  document.getElementById('video').addEventListener('click', () => {
    document.getElementById('clicks').textContent = 'CLICK HIT THE VIDEO HOLE';
  });

  document.getElementById('toggle').addEventListener('click', () =>
    invoke('toggle_playback'));

  // Question 4. Report the hole's rect in physical pixels every frame the
  // layout could have changed. Cheap, and it means resize needs no event.
  const hole = document.getElementById('video');
  let last = '';
  function reportRect() {
    const r = hole.getBoundingClientRect();
    const s = window.devicePixelRatio;
    const key = `${r.x},${r.y},${r.width},${r.height},${s}`;

    if (key !== last) {
      last = key;
      invoke('set_video_rect', {
        x: r.x * s, y: r.y * s, width: r.width * s, height: r.height * s,
      });
    }
  }

  // Question 2. The page polls rather than being pushed to, so the readout
  // costs the render path nothing.
  let uiFrames = 0, uiSince = performance.now();
  async function tick() {
    reportRect();
    uiFrames++;

    const now = performance.now();
    if (now - uiSince > 500) {
      const uiFps = (uiFrames * 1000) / (now - uiSince);
      uiFrames = 0; uiSince = now;

      const s = await invoke('stats');
      document.getElementById('readout').textContent =
        `ui ${uiFps.toFixed(0)} · video ${s.video_fps.toFixed(1)} · ` +
        `present ${s.present_fps.toFixed(1)} · dropped ${s.dropped}` +
        (s.playing ? '' : ' · paused');
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
